services:
  streamed:
    build: .
    restart: unless-stopped
    init: true
    ipc: host
    ports:
      - "${STREAMED_PORT:-7010}:7010"
    environment:
      PORT: 7010
      # PUBLIC_URL: https://your.domain   # set when behind a reverse proxy
      # PROXY_SECRET: change-me            # keeps playback links valid across restarts
